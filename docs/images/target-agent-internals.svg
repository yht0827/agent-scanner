<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 12.5px; font-weight: 700; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; }
      .tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; }
      .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 10.5px; fill: #334155; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 10px; fill: #64748b; }
      .box { rx: 8px; ry: 8px; stroke-width: 1.5px; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5px; fill: none; }
      .arrow-head { fill: #94a3b8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="340" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="10" />

  <!-- Top: User Actor -->
  <g transform="translate(330, 14)">
    <rect class="box" width="220" height="34" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="110" y="21" text-anchor="middle" class="title-text" fill="#1e293b">사용자 (공격자 / 일반 고객)</text>
  </g>

  <!-- Arrow Actor -> Agent -->
  <path d="M 440 48 L 440 68" class="arrow" marker-end="url(#arrow)" />
  <rect x="375" y="52" width="130" height="16" fill="#ffffff" rx="3" stroke="#e2e8f0" />
  <text x="440" y="63" text-anchor="middle" class="sub-text" font-weight="600">자연어 프롬프트 주입</text>

  <!-- Agent & AOP Container -->
  <g transform="translate(140, 72)">
    <rect class="box" width="600" height="46" fill="#eff6ff" stroke="#3b82f6" />
    <text x="170" y="28" text-anchor="middle" class="title-text" fill="#1d4ed8">LLM Agent (CustomerSupportAgent)</text>
    <line x1="340" y1="8" x2="340" y2="38" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="465" y="28" text-anchor="middle" class="title-text" fill="#0369a1">Spring AOP 런타임 감사 인터셉터</text>
  </g>

  <!-- Bus line from Agent bottom to 5 columns -->
  <path d="M 440 118 L 440 138" class="arrow" />
  <path d="M 98 138 L 782 138" class="arrow" />
  <path d="M 98 138 L 98 152" class="arrow" marker-end="url(#arrow)" />
  <path d="M 269 138 L 269 152" class="arrow" marker-end="url(#arrow)" />
  <path d="M 440 138 L 440 152" class="arrow" marker-end="url(#arrow)" />
  <path d="M 611 138 L 611 152" class="arrow" marker-end="url(#arrow)" />
  <path d="M 782 138 L 782 152" class="arrow" marker-end="url(#arrow)" />

  <!-- Column 1: 정상 업무 -->
  <g transform="translate(20, 154)">
    <rect class="box" width="156" height="170" fill="#f8fafc" stroke="#10b981" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#ecfdf5" />
    <rect x="0" y="16" width="156" height="8" fill="#ecfdf5" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" fill="#059669">정상 업무 (Baseline)</text>
    <text x="78" y="44" text-anchor="middle" class="tool-name" fill="#047857">searchProduct()</text>
    <text x="78" y="60" text-anchor="middle" class="sub-text">(상품 카탈로그 검색)</text>
    <path d="M 78 72 L 78 88" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="12" y="94" width="132" height="62" fill="#ffffff" stroke="#10b981" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="116" text-anchor="middle" class="title-text" fill="#065f46">상품 DB</text>
    <text x="78" y="132" text-anchor="middle" class="sub-text">일반 상품 카탈로그</text>
    <text x="78" y="146" text-anchor="middle" class="tag-text" fill="#059669">PASS (정상 허용)</text>
  </g>

  <!-- Column 2: 개인정보 -->
  <g transform="translate(191, 154)">
    <rect class="box" width="156" height="170" fill="#f8fafc" stroke="#3b82f6" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#eff6ff" />
    <rect x="0" y="16" width="156" height="8" fill="#eff6ff" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" fill="#2563eb">개인정보 (PII)</text>
    <text x="78" y="44" text-anchor="middle" class="tool-name" fill="#1d4ed8">getUserInfo()</text>
    <text x="78" y="60" text-anchor="middle" class="sub-text">(고객 프로필 조회)</text>
    <path d="M 78 72 L 78 88" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="12" y="94" width="132" height="62" fill="#ffffff" stroke="#3b82f6" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="116" text-anchor="middle" class="title-text" fill="#1e40af">회원 DB (PII)</text>
    <text x="78" y="132" text-anchor="middle" class="sub-text">BOLA / 타인 계정 탈취</text>
    <text x="78" y="146" text-anchor="middle" class="tag-text" fill="#dc2626">FAIL (타인정보 노출)</text>
  </g>

  <!-- Column 3: DB 직접조회 -->
  <g transform="translate(362, 154)">
    <rect class="box" width="156" height="170" fill="#f8fafc" stroke="#dc2626" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#fef2f2" />
    <rect x="0" y="16" width="156" height="8" fill="#fef2f2" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" font-size="9.5px" fill="#dc2626">DB 직접조회 / SQL Injection</text>
    <text x="78" y="44" text-anchor="middle" class="tool-name" fill="#b91c1c">queryDatabase()</text>
    <text x="78" y="60" text-anchor="middle" class="sub-text">(임의 SQL 직접 실행)</text>
    <path d="M 78 72 L 78 88" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="12" y="94" width="132" height="62" fill="#ffffff" stroke="#dc2626" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="116" text-anchor="middle" class="title-text" fill="#991b1b">PostgreSQL 16</text>
    <text x="78" y="132" text-anchor="middle" class="sub-text">targetdb (admin_users)</text>
    <text x="78" y="146" text-anchor="middle" class="tag-text" fill="#dc2626">FAIL (해시 덤프 위험)</text>
  </g>

  <!-- Column 4: RAG 지식베이스 -->
  <g transform="translate(533, 154)">
    <rect class="box" width="156" height="170" fill="#f8fafc" stroke="#8b5cf6" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#f5f3ff" />
    <rect x="0" y="16" width="156" height="8" fill="#f5f3ff" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" fill="#7c3aed">RAG 지식베이스</text>
    <text x="78" y="44" text-anchor="middle" class="tool-name" fill="#6d28d9">searchKnowledgeBase()</text>
    <text x="78" y="60" text-anchor="middle" class="sub-text">(대외비 벡터 검색)</text>
    <path d="M 78 72 L 78 88" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="12" y="94" width="132" height="62" fill="#ffffff" stroke="#8b5cf6" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="116" text-anchor="middle" class="title-text" fill="#5b21b6">PostgreSQL 16</text>
    <text x="78" y="132" text-anchor="middle" class="sub-text">rag_knowledge_base</text>
    <text x="78" y="146" text-anchor="middle" class="tag-text" fill="#dc2626">FAIL (대외비/급여 탈취)</text>
  </g>

  <!-- Column 5: OS / 사설망 -->
  <g transform="translate(704, 154)">
    <rect class="box" width="156" height="170" fill="#f8fafc" stroke="#ea580c" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#fff7ed" />
    <rect x="0" y="16" width="156" height="8" fill="#fff7ed" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" fill="#c2410c">OS / 사설망 (SSRF)</text>
    <text x="78" y="38" text-anchor="middle" class="tool-name" fill="#9a3412">readFile()</text>
    <text x="78" y="52" text-anchor="middle" class="tool-name" fill="#9a3412">executeCommand()</text>
    <text x="78" y="66" text-anchor="middle" class="sub-text">(OS 셸 / curl 요청)</text>
    <path d="M 78 74 L 78 88" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="12" y="94" width="132" height="62" fill="#ffffff" stroke="#ea580c" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="114" text-anchor="middle" class="title-text" fill="#9a3412">Host OS &amp; IMDS</text>
    <text x="78" y="128" text-anchor="middle" class="sub-text">/etc/passwd, 169.254.x</text>
    <text x="78" y="146" text-anchor="middle" class="tag-text" fill="#dc2626">FAIL (RCE/SSRF 위험)</text>
  </g>
</svg>
