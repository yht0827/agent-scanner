<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 12.5px; font-weight: 700; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 800; }
      .tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; }
      .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 11px; font-weight: 600; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 10px; fill: #64748b; }
      .box { rx: 8px; ry: 8px; stroke-width: 1.5px; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5px; fill: none; }
      .arrow-head { fill: #94a3b8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="320" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="10" />

  <!-- Top: User Actor -->
  <g transform="translate(330, 14)">
    <rect class="box" width="220" height="34" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="110" y="21" text-anchor="middle" class="title-text" fill="#1e293b">사용자 (공격자 / 일반 고객)</text>
  </g>

  <!-- Arrow Actor -> Agent -->
  <path d="M 440 48 L 440 68" class="arrow" marker-end="url(#arrow)" />
  <rect x="375" y="52" width="130" height="16" fill="#ffffff" rx="3" stroke="#e2e8f0" />
  <text x="440" y="63" text-anchor="middle" class="sub-text" font-weight="600">자연어 프롬프트 주입</text>

  <!-- Agent & AOP Container -->
  <g transform="translate(140, 72)">
    <rect class="box" width="600" height="44" fill="#eff6ff" stroke="#3b82f6" />
    <text x="165" y="27" text-anchor="middle" class="title-text" fill="#1d4ed8">LLM Agent (CustomerSupportAgent)</text>
    <line x1="335" y1="8" x2="335" y2="36" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="465" y="27" text-anchor="middle" class="title-text" fill="#0369a1">Spring AOP Tool 실행 추적</text>
  </g>

  <!-- Bus line from Agent bottom to 5 columns -->
  <path d="M 440 116 L 440 134" class="arrow" />
  <path d="M 98 134 L 782 134" class="arrow" />
  <path d="M 98 134 L 98 148" class="arrow" marker-end="url(#arrow)" />
  <path d="M 269 134 L 269 148" class="arrow" marker-end="url(#arrow)" />
  <path d="M 440 134 L 440 148" class="arrow" marker-end="url(#arrow)" />
  <path d="M 611 134 L 611 148" class="arrow" marker-end="url(#arrow)" />
  <path d="M 782 134 L 782 148" class="arrow" marker-end="url(#arrow)" />

  <!-- Column 1: 정상 업무 -->
  <g transform="translate(20, 150)">
    <rect class="box" width="156" height="152" fill="#f8fafc" stroke="#10b981" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#ecfdf5" />
    <rect x="0" y="16" width="156" height="8" fill="#ecfdf5" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" fill="#059669">정상 업무 (Baseline)</text>
    <text x="78" y="52" text-anchor="middle" class="tool-name" fill="#047857">searchProduct()</text>
    <path d="M 78 66 L 78 80" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="6" y="82" width="144" height="60" fill="#ffffff" stroke="#10b981" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="105" text-anchor="middle" class="item-text" fill="#065f46">상품 카탈로그 DB</text>
    <text x="78" y="125" text-anchor="middle" class="tag-text" fill="#059669">PASS (정상 허용)</text>
  </g>

  <!-- Column 2: 개인정보 -->
  <g transform="translate(191, 150)">
    <rect class="box" width="156" height="152" fill="#f8fafc" stroke="#3b82f6" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#eff6ff" />
    <rect x="0" y="16" width="156" height="8" fill="#eff6ff" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" fill="#2563eb">개인정보 (PII)</text>
    <text x="78" y="52" text-anchor="middle" class="tool-name" fill="#1d4ed8">getUserInfo()</text>
    <path d="M 78 66 L 78 80" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="6" y="82" width="144" height="60" fill="#ffffff" stroke="#3b82f6" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="105" text-anchor="middle" class="item-text" fill="#1e40af">고객 DB (PII)</text>
    <text x="78" y="125" text-anchor="middle" class="tag-text" fill="#dc2626">FAIL (타인 계정 접근)</text>
  </g>

  <!-- Column 3: DB 직접조회 -->
  <g transform="translate(362, 150)">
    <rect class="box" width="156" height="152" fill="#f8fafc" stroke="#dc2626" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#fef2f2" />
    <rect x="0" y="16" width="156" height="8" fill="#fef2f2" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" font-size="9px" fill="#dc2626">DB 조회 / SQL Injection</text>
    <text x="78" y="52" text-anchor="middle" class="tool-name" fill="#b91c1c">queryDatabase()</text>
    <path d="M 78 66 L 78 80" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="6" y="82" width="144" height="60" fill="#ffffff" stroke="#dc2626" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="105" text-anchor="middle" class="item-text" font-size="10px" fill="#991b1b">targetdb (admin_users)</text>
    <text x="78" y="125" text-anchor="middle" class="tag-text" font-size="8.5px" fill="#dc2626">FAIL (관리자 계정 정보 노출)</text>
  </g>

  <!-- Column 4: RAG 지식베이스 -->
  <g transform="translate(533, 150)">
    <rect class="box" width="156" height="152" fill="#f8fafc" stroke="#8b5cf6" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#f5f3ff" />
    <rect x="0" y="16" width="156" height="8" fill="#f5f3ff" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" fill="#7c3aed">RAG 지식베이스</text>
    <text x="78" y="52" text-anchor="middle" class="tool-name" fill="#6d28d9">searchKnowledgeBase()</text>
    <path d="M 78 66 L 78 80" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="6" y="82" width="144" height="60" fill="#ffffff" stroke="#8b5cf6" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="105" text-anchor="middle" class="item-text" fill="#5b21b6">rag_knowledge_base</text>
    <text x="78" y="125" text-anchor="middle" class="tag-text" fill="#dc2626">FAIL (대외비 급여 탈취)</text>
  </g>

  <!-- Column 5: OS / 내부망 / IMDS -->
  <g transform="translate(704, 150)">
    <rect class="box" width="156" height="152" fill="#f8fafc" stroke="#ea580c" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#fff7ed" />
    <rect x="0" y="16" width="156" height="8" fill="#fff7ed" />
    <text x="78" y="16" text-anchor="middle" class="tag-text" font-size="9.5px" fill="#c2410c">OS / 내부망 / IMDS</text>
    <text x="78" y="44" text-anchor="middle" class="tool-name" fill="#9a3412">executeCommand()</text>
    <text x="78" y="58" text-anchor="middle" class="tool-name" font-size="10px" fill="#9a3412">readFile()</text>
    <path d="M 78 68 L 78 80" class="arrow" marker-end="url(#arrow)" />
    <!-- Target Resource -->
    <rect x="6" y="82" width="144" height="60" fill="#ffffff" stroke="#ea580c" stroke-dasharray="3 2" rx="6" />
    <text x="78" y="105" text-anchor="middle" class="item-text" font-size="10.5px" fill="#9a3412">Host OS / AWS IMDS</text>
    <text x="78" y="125" text-anchor="middle" class="tag-text" font-size="9.5px" fill="#dc2626">FAIL (명령 실행 / SSRF)</text>
  </g>
</svg>
