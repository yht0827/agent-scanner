<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 11px; fill: #64748b; }
      .cat-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 11.5px; font-weight: 700; }
      .count-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; }
      .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 10px; fill: #475569; }
      .pass-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 10px; font-weight: 700; fill: #166534; }
      .flow-step { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 11px; font-weight: 700; }
      .flow-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 9.5px; fill: #64748b; }
      .box { rx: 8px; ry: 8px; stroke-width: 1px; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5px; fill: none; }
      .arrow-head { fill: #94a3b8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="270" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="10" />

  <!-- Header Section -->
  <g transform="translate(24, 20)">
    <text x="0" y="0" class="main-title" dominant-baseline="hanging">AgentScanner 17개 보안 점검 카탈로그 및 검증 흐름</text>
    <text x="0" y="20" class="sub-title" dominant-baseline="hanging">OWASP LLM 기반 5개 카테고리 진단 → 보안 가드레일 적용 → 1-Click Re-Test를 통한 PASS 검증</text>
  </g>

  <!-- 5 Categories Row (y = 62) -->
  <!-- Category 1: Prompt Injection -->
  <g transform="translate(24, 62)">
    <rect class="box" width="156" height="120" fill="#f8fafc" stroke="#3b82f6" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#eff6ff" />
    <rect x="0" y="16" width="156" height="8" fill="#eff6ff" />
    <text x="10" y="16" class="cat-title" fill="#1e40af">Prompt Injection</text>
    <rect x="120" y="4" width="26" height="16" rx="4" fill="#dbeafe" />
    <text x="133" y="16" class="count-badge" fill="#1d4ed8" text-anchor="middle">4건</text>
    
    <text x="10" y="42" class="item-text">• 시스템 지침 우회</text>
    <text x="10" y="58" class="item-text">• 멀티턴 탈옥(Crescendo)</text>
    <text x="10" y="74" class="item-text">• 간접 프롬프트 주입(IPI)</text>
    
    <line x1="10" y1="88" x2="146" y2="88" stroke="#e2e8f0" stroke-width="1" />
    <rect x="10" y="96" width="56" height="16" rx="4" fill="#dcfce7" />
    <text x="38" y="108" class="pass-text" text-anchor="middle">4 PASS</text>
  </g>

  <!-- Category 2: Sensitive Data Leakage -->
  <g transform="translate(192, 62)">
    <rect class="box" width="156" height="120" fill="#f8fafc" stroke="#f43f5e" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#fff1f2" />
    <rect x="0" y="16" width="156" height="8" fill="#fff1f2" />
    <text x="10" y="16" class="cat-title" fill="#be123c">Data Leakage</text>
    <rect x="120" y="4" width="26" height="16" rx="4" fill="#ffe4e6" />
    <text x="133" y="16" class="count-badge" fill="#be123c" text-anchor="middle">4건</text>
    
    <text x="10" y="42" class="item-text">• PII 개인정보·신용카드</text>
    <text x="10" y="58" class="item-text">• API Key·클라우드 키</text>
    <text x="10" y="74" class="item-text">• RAG 내부 문서 노출</text>
    
    <line x1="10" y1="88" x2="146" y2="88" stroke="#e2e8f0" stroke-width="1" />
    <rect x="10" y="96" width="56" height="16" rx="4" fill="#dcfce7" />
    <text x="38" y="108" class="pass-text" text-anchor="middle">4 PASS</text>
  </g>

  <!-- Category 3: Excessive Agency -->
  <g transform="translate(360, 62)">
    <rect class="box" width="160" height="120" fill="#f8fafc" stroke="#f59e0b" />
    <rect x="0" y="0" width="160" height="24" rx="8" fill="#fffbeb" />
    <rect x="0" y="16" width="160" height="8" fill="#fffbeb" />
    <text x="10" y="16" class="cat-title" fill="#b45309">Excessive Agency</text>
    <rect x="124" y="4" width="26" height="16" rx="4" fill="#fef3c7" />
    <text x="137" y="16" class="count-badge" fill="#b45309" text-anchor="middle">5건</text>
    
    <text x="10" y="42" class="item-text">• 권한 없는 DB 조회(Dump)</text>
    <text x="10" y="58" class="item-text">• Prompt-to-SQL Injection</text>
    <text x="10" y="74" class="item-text">• 타인 정보 조회(BOLA), SSRF</text>
    
    <line x1="10" y1="88" x2="150" y2="88" stroke="#e2e8f0" stroke-width="1" />
    <rect x="10" y="96" width="56" height="16" rx="4" fill="#dcfce7" />
    <text x="38" y="108" class="pass-text" text-anchor="middle">5 PASS</text>
  </g>

  <!-- Category 4: Tool Abuse -->
  <g transform="translate(532, 62)">
    <rect class="box" width="156" height="120" fill="#f8fafc" stroke="#8b5cf6" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#f5f3ff" />
    <rect x="0" y="16" width="156" height="8" fill="#f5f3ff" />
    <text x="10" y="16" class="cat-title" fill="#6d28d9">Tool Abuse</text>
    <rect x="120" y="4" width="26" height="16" rx="4" fill="#ede9fe" />
    <text x="133" y="16" class="count-badge" fill="#6d28d9" text-anchor="middle">2건</text>
    
    <text x="10" y="42" class="item-text">• 기관 사칭 피싱 알림 발송</text>
    <text x="10" y="58" class="item-text">• 반복 도구 호출 자원 고갈</text>
    <text x="10" y="74" class="item-text">• 무한 재귀 DoS 유도</text>
    
    <line x1="10" y1="88" x2="146" y2="88" stroke="#e2e8f0" stroke-width="1" />
    <rect x="10" y="96" width="56" height="16" rx="4" fill="#dcfce7" />
    <text x="38" y="108" class="pass-text" text-anchor="middle">2 PASS</text>
  </g>

  <!-- Category 5: Baseline -->
  <g transform="translate(700, 62)">
    <rect class="box" width="156" height="120" fill="#f8fafc" stroke="#10b981" />
    <rect x="0" y="0" width="156" height="24" rx="8" fill="#ecfdf5" />
    <rect x="0" y="16" width="156" height="8" fill="#ecfdf5" />
    <text x="10" y="16" class="cat-title" fill="#047857">Baseline (정상 검증)</text>
    <rect x="120" y="4" width="26" height="16" rx="4" fill="#d1fae5" />
    <text x="133" y="16" class="count-badge" fill="#047857" text-anchor="middle">2건</text>
    
    <text x="10" y="42" class="item-text">• 정상 업무 질의 (환불/배송)</text>
    <text x="10" y="58" class="item-text">• 본인 주문 조회 & PII 마스킹</text>
    <text x="10" y="74" class="item-text">• Over-blocking 방지 확인</text>
    
    <line x1="10" y1="88" x2="146" y2="88" stroke="#e2e8f0" stroke-width="1" />
    <rect x="10" y="96" width="124" height="16" rx="4" fill="#dcfce7" />
    <text x="72" y="108" class="pass-text" text-anchor="middle">정상 비즈니스 유지</text>
  </g>

  <!-- Bottom Re-Test Lifecycle Banner (y = 196) -->
  <g transform="translate(24, 196)">
    <rect width="832" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />

    <!-- Step 1: FAIL -->
    <g transform="translate(20, 10)">
      <rect width="160" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
      <text x="12" y="16" class="flow-step" fill="#991b1b">취약점 탐지 (FAIL)</text>
      <text x="12" y="29" class="flow-sub">도구 오남용 · 민감정보 노출</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 190 28 L 214 28" class="arrow" marker-end="url(#arrow)" />

    <!-- Step 2: Guardrail -->
    <g transform="translate(224, 10)">
      <rect width="180" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="16" class="flow-step" fill="#1e40af">보호 설정 적용 (Guardrail)</text>
      <text x="12" y="29" class="flow-sub">Tool 언바인딩 · 출력 살균</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 414 28 L 438 28" class="arrow" marker-end="url(#arrow)" />

    <!-- Step 3: Re-Test -->
    <g transform="translate(448, 10)">
      <rect width="170" height="36" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" />
      <text x="12" y="16" class="flow-step" fill="#6d28d9">재검증 실행 (Re-Test)</text>
      <text x="12" y="29" class="flow-sub">해당 항목 1-Click 핀포인트 검증</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 628 28 L 652 28" class="arrow" marker-end="url(#arrow)" />

    <!-- Step 4: PASS -->
    <g transform="translate(662, 10)">
      <rect width="150" height="36" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1" />
      <text x="12" y="16" class="flow-step" fill="#166534">위험 종결 (PASS · 0점)</text>
      <text x="12" y="29" class="flow-sub">도구 호출 0건 · 정상 동작</text>
    </g>
  </g>
</svg>
