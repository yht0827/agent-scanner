<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 215" width="100%" height="100%">
  <defs>
    <style>
      .step-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 11px; fill: #334155; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; font-size: 10.5px; }
      .box { rx: 8px; ry: 8px; stroke-width: 1.5px; }
      .arrow { stroke: #94a3b8; stroke-width: 2px; fill: none; }
      .arrow-head { fill: #94a3b8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="215" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="10" />

  <!-- STEP 01 -->
  <g transform="translate(20, 20)">
    <rect class="box" width="195" height="175" fill="#f8fafc" stroke="#3b82f6" />
    <rect x="0" y="0" width="195" height="26" rx="8" fill="#eff6ff" />
    <rect x="0" y="18" width="195" height="8" fill="#eff6ff" />
    <text x="12" y="17" class="step-badge" fill="#2563eb">STEP 01</text>
    <text x="12" y="44" class="title-text">Security Test 실행</text>
    <text x="12" y="68" class="item-text">• 17대 보안 점검 시나리오</text>
    <text x="12" y="88" class="item-text">• Engine(8080) 세션 제어</text>
    <text x="12" y="108" class="item-text">• HTTP 원격 주입 테스트</text>
    <line x1="12" y1="132" x2="183" y2="132" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="154" class="sub-text" fill="#64748b">발신: <tspan font-weight="600" fill="#2563eb">Scanner Engine</tspan></text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 215 107 L 233 107" class="arrow" marker-end="url(#arrow)" />

  <!-- STEP 02 -->
  <g transform="translate(235, 20)">
    <rect class="box" width="195" height="175" fill="#f8fafc" stroke="#8b5cf6" />
    <rect x="0" y="0" width="195" height="26" rx="8" fill="#f5f3ff" />
    <rect x="0" y="18" width="195" height="8" fill="#f5f3ff" />
    <text x="12" y="17" class="step-badge" fill="#7c3aed">STEP 02</text>
    <text x="12" y="44" class="title-text">AI Agent Tool Calling</text>
    <text x="12" y="68" class="item-text">• OpenAI Function Calling</text>
    <text x="12" y="88" class="item-text">• DB / OS / 사설망 도구 호출</text>
    <text x="12" y="108" class="item-text">• 공격 유도 프롬프트 실행</text>
    <line x1="12" y1="132" x2="183" y2="132" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="154" class="sub-text" fill="#64748b">수행: <tspan font-weight="600" fill="#7c3aed">Target Agent(8081)</tspan></text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 430 107 L 448 107" class="arrow" marker-end="url(#arrow)" />

  <!-- STEP 03 -->
  <g transform="translate(450, 20)">
    <rect class="box" width="195" height="175" fill="#f8fafc" stroke="#0284c7" />
    <rect x="0" y="0" width="195" height="26" rx="8" fill="#f0f9ff" />
    <rect x="0" y="18" width="195" height="8" fill="#f0f9ff" />
    <text x="12" y="17" class="step-badge" fill="#0284c7">STEP 03</text>
    <text x="12" y="44" class="title-text">Tool Trace 증적 수집</text>
    <text x="12" y="68" class="item-text">• Spring AOP 런타임 가로채기</text>
    <text x="12" y="88" class="item-text">• 도구명·실행인자·반환값 캡처</text>
    <text x="12" y="108" class="item-text">• AgentExecutionTrace 생성</text>
    <line x1="12" y1="132" x2="183" y2="132" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="154" class="sub-text" fill="#64748b">감사: <tspan font-weight="600" fill="#0284c7">AOP Trace Interceptor</tspan></text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 645 107 L 663 107" class="arrow" marker-end="url(#arrow)" />

  <!-- STEP 04 -->
  <g transform="translate(665, 20)">
    <rect class="box" width="195" height="175" fill="#f8fafc" stroke="#10b981" />
    <rect x="0" y="0" width="195" height="26" rx="8" fill="#ecfdf5" />
    <rect x="0" y="18" width="195" height="8" fill="#ecfdf5" />
    <text x="12" y="17" class="step-badge" fill="#059669">STEP 04</text>
    <text x="12" y="44" class="title-text">Evidence 판정 &amp; Re-Test</text>
    <text x="12" y="68" class="item-text">• PASS / FAIL 증적 기반 판정</text>
    <text x="12" y="88" class="item-text">• 자체 RiskEvaluator 100점 산정</text>
    <text x="12" y="108" class="item-text">• 가드레일 적용 ➔ Re-Test 종결</text>
    <line x1="12" y1="132" x2="183" y2="132" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="154" class="sub-text" fill="#64748b">종결: <tspan font-weight="600" fill="#059669">Pinpoint Re-Test</tspan></text>
  </g>
</svg>
